<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RioMart Agent Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #e2e8f0; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .glass-panel { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(56, 189, 248, 0.2); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); }
        .scroll-custom::-webkit-scrollbar { width: 6px; }
        .scroll-custom::-webkit-scrollbar-track { background: #0f172a; }
        .scroll-custom::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        
        /* Toast Animation */
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .toast { animation: slideIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-[#020617] text-slate-200 relative">

    <!-- Toast Container -->
    <div id="toast-container" class="absolute top-20 right-6 flex flex-col gap-2 z-50 pointer-events-none"></div>

    <!-- Header -->
    <header class="h-16 border-b border-cyan-900/50 bg-slate-900/50 flex items-center px-6 justify-between backdrop-blur-sm sticky top-0 z-40">
        <div class="flex items-center gap-4">
            <div class="h-8 w-8 bg-cyan-600 rounded flex items-center justify-center font-bold text-black">A</div>
            <div>
                <h1 class="font-bold text-cyan-400 tracking-wider">RIOMART AGENT</h1>
                <p class="text-[10px] text-slate-400 font-mono">ID: rio_sk_live_7384928492</p>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div class="flex flex-col items-end">
                <span id="agent-status" class="text-xs font-mono text-green-400">● SYSTEM ACTIVE</span>
                <span class="text-[10px] text-slate-500">Auto-Logistics Engaged</span>
            </div>
            <div class="flex gap-2">
                <button onclick="control('test_order')" class="px-3 py-1 bg-blue-900/30 text-blue-400 border border-blue-800 text-xs font-mono hover:bg-blue-900/50 transition">TEST CONN</button>
                <button onclick="control('start')" class="px-3 py-1 bg-green-900/30 text-green-400 border border-green-800 text-xs font-mono hover:bg-green-900/50 transition">RESUME</button>
                <button onclick="control('stop')" class="px-3 py-1 bg-red-900/30 text-red-400 border border-red-800 text-xs font-mono hover:bg-red-900/50 transition">PAUSE</button>
            </div>
        </div>
    </header>

    <!-- Main Grid -->
    <div class="flex-1 grid grid-cols-12 gap-6 p-6 overflow-hidden">
        
        <!-- Left: Logistics Monitor -->
        <div class="col-span-8 flex flex-col gap-6">
            
            <!-- Inventory Graph Panel -->
            <div class="glass-panel p-5 rounded-lg flex-1 flex flex-col min-h-0">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-cyan-300 font-bold flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                        Local Inventory Levels (Real-time)
                    </h2>
                    <span class="text-xs font-mono text-slate-500">POLLING: 2s</span>
                </div>
                <!-- Canvas container needs relative positioning and full size -->
                <div class="flex-1 relative w-full h-full min-h-[250px]">
                    <canvas id="stockChart"></canvas>
                </div>
            </div>
            
            <!-- Manual Resource Request Panel -->
            <div class="glass-panel p-5 rounded-lg border-l-4 border-purple-500">
                <h3 class="font-bold text-lg text-purple-400 mb-3 flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    Manual Resource Request
                </h3>
                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="text-[10px] text-slate-500 uppercase font-bold tracking-wider mb-1 block">Select Supplier SKU</label>
                        <select id="manual-sku" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:border-purple-500 outline-none transition">
                            <option>Loading Catalog...</option>
                        </select>
                    </div>
                    <div class="w-24">
                        <label class="text-[10px] text-slate-500 uppercase font-bold tracking-wider mb-1 block">Quantity</label>
                        <input id="manual-qty" type="number" value="100" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:border-purple-500 outline-none transition">
                    </div>
                    <div class="flex items-end">
                        <button onclick="sendManualRequest()" class="bg-purple-600 hover:bg-purple-500 text-white font-bold py-2 px-6 rounded text-sm transition shadow-lg shadow-purple-900/50 h-[38px]">
                            SEND REQUEST
                        </button>
                    </div>
                </div>
            </div>

            <!-- Terminal Output -->
            <div class="glass-panel p-0 rounded-lg h-64 flex flex-col">
                <div class="bg-black/40 p-2 px-4 border-b border-white/5 flex justify-between items-center">
                    <span class="text-xs font-mono text-slate-400">>_ SYSTEM_LOGS</span>
                    <button onclick="control('clear_logs')" class="text-[10px] text-slate-600 hover:text-white">CLEAR</button>
                </div>
                <div id="logs" class="flex-1 overflow-y-auto p-4 font-mono text-xs space-y-1 scroll-custom bg-black/60">
                    <div class="text-slate-500">Initializing Uplink...</div>
                </div>
            </div>
        </div>

        <!-- Right: Red Team Console -->
        <div class="col-span-4 flex flex-col">
            <div class="glass-panel p-5 rounded-lg h-full overflow-y-auto border-red-900/30">
                <div class="mb-6 pb-4 border-b border-red-900/30">
                    <h2 class="text-red-500 font-bold mb-1 flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                        RED TEAM ARSENAL
                    </h2>
                    <p class="text-xs text-red-300/60">AUTHORIZED FOR SECURITY TESTING ONLY</p>
                </div>

                <div id="attacks-container" class="space-y-4">
                    <!-- Attacks injected here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. Chart Setup
        const ctx = document.getElementById('stockChart').getContext('2d');
        const stockChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: [],
                datasets: [{
                    label: 'Stock Quantity',
                    data: [],
                    backgroundColor: 'rgba(6, 182, 212, 0.5)',
                    borderColor: '#06b6d4',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' } },
                    x: { grid: { display: false } }
                }
            }
        });

        // 2. Data Polling
        async function refreshData() {
            try {
                // Fetch Stats
                const statsRes = await fetch('/api/stats');
                const stats = await statsRes.json();
                
                // Update System Status
                const statusEl = document.getElementById('agent-status');
                if(stats.running) {
                    statusEl.innerText = "● SYSTEM ACTIVE";
                    statusEl.className = "text-xs font-mono text-green-400";
                } else {
                    statusEl.innerText = "● SYSTEM PAUSED";
                    statusEl.className = "text-xs font-mono text-red-400";
                }

                // Update Chart
                if(stats.inventory) {
                    stockChart.data.labels = Object.keys(stats.inventory);
                    stockChart.data.datasets[0].data = Object.values(stats.inventory);
                    stockChart.update('none'); // 'none' mode for performance
                }

                // Fetch Logs
                const logRes = await fetch('/logs');
                const logs = await logRes.json();
                const logContainer = document.getElementById('logs');
                logContainer.innerHTML = logs.map(l => {
                    let color = 'text-slate-300';
                    if(l.type === 'ERROR') color = 'text-red-400';
                    if(l.type === 'SUCCESS') color = 'text-green-400';
                    if(l.type === 'WARNING') color = 'text-yellow-400';
                    if(l.type === 'ATTACK') color = 'text-pink-500 font-bold';
                    
                    return `<div class="mb-1">
                        <span class="text-slate-600">[${l.time}]</span> 
                        <span class="${color}">${l.msg}</span>
                    </div>`
                }).join('');
                
            } catch (e) {
                console.error("Polling Error", e);
            }
        }
        setInterval(refreshData, 2000);

        // 3. Control Actions
        async function control(action) {
            await fetch(`/control/${action}`, { method: 'POST' });
            refreshData();
        }

        // 4. Attack UI Generator
        const attacks = {
            "SQLi": "💉 SQL Injection (Data Extraction)",
            "BOLA": "🆔 IDOR (Broken Auth)",
            "LargePayload": "🐘 Large Payload (DoS Stress)",
            "API_Hijack": "🏴‍☠️ Price Manipulation (MITM)"
        };

        const attackContainer = document.getElementById('attacks-container');
        Object.entries(attacks).forEach(([key, desc]) => {
            const div = document.createElement('div');
            div.className = "bg-red-950/20 border border-red-900/50 p-3 rounded group hover:bg-red-900/30 transition cursor-pointer";
            div.innerHTML = `
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-red-400 text-sm group-hover:text-red-300">${key}</h3>
                    <button onclick="launch('${key}')" class="bg-red-900/50 hover:bg-red-600 text-red-200 text-xs px-2 py-1 rounded transition">LAUNCH</button>
                </div>
                <p class="text-[10px] text-red-300/50 mt-1">${desc}</p>
            `;
            div.onclick = (e) => {
                if(e.target.tagName !== 'BUTTON') launch(key);
            }
            attackContainer.appendChild(div);
        });

        // Toast Message Logic
        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = "toast bg-cyan-900/90 text-cyan-100 px-4 py-2 rounded text-sm border border-cyan-500/50 shadow-lg backdrop-blur pointer-events-auto flex items-center gap-2";
            toast.innerHTML = `<span>🚀</span> <span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        async function launch(type) {
            try {
                showToast(`Launching ${type}...`);
                await fetch('/launch_attack', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ category: 'Manual', type: type, endpoint: '/api', payload: {} })
                });
                refreshData();
            } catch (e) {
                console.error(e);
            }
        }

        async function sendManualRequest() {
            const sku = document.getElementById('manual-sku').value;
            const qty = document.getElementById('manual-qty').value;
            
            showToast(`Requesting ${qty} units of ${sku}...`);
            
            await fetch('/control/manual_request', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ sku: sku, quantity: qty })
            });
            refreshData();
        }

        async function initCatalog() {
            try {
                console.log("Fetching catalog...");
                const res = await fetch('/api/local_products');
                const products = await res.json();
                console.log("Catalog received:", products.length);
                
                const select = document.getElementById('manual-sku');
                
                if(products.length > 0) {
                    select.innerHTML = products.map(p => 
                        `<option value="${p.sku}">${p.name} (Stock: ${p.stock})</option>`
                    ).join('');
                }
            } catch(e) {
                console.error("Catalog Init Error:", e);
            }
        }

        // Init
        console.log("Starting Agent Console...");
        refreshData();
        initCatalog(); 
        setInterval(initCatalog, 5000); 
    </script>
</body>
</html>
